import android.animation.ValueAnimator
import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.app.Service
import android.content.Context
import android.content.Intent
import android.content.pm.ServiceInfo
import android.content.res.Configuration
import android.graphics.PixelFormat
import android.graphics.Rect
import android.os.Build
import android.os.Handler
import android.os.IBinder
import android.os.Looper
import android.os.SystemClock
import android.util.DisplayMetrics
import android.view.ContextThemeWrapper
import android.view.Gravity
import android.view.View
import android.view.WindowManager
import android.widget.PopupMenu
import android.widget.Toast
import androidx.core.app.NotificationCompat
import androidx.core.app.ServiceCompat
import androidx.core.content.ContextCompat
import app.lenstranslate.core.AppSettings
import app.lenstranslate.core.BubblePos
import app.lenstranslate.core.BubbleState
import app.lenstranslate.core.Pipeline
import app.lenstranslate.ui.MainActivity

class BubbleService : Service(), BubbleView.Listener {

    companion object {
        const val ACTION_SHOW = "app.lenstranslate.SHOW"
        const val ACTION_HIDE = "app.lenstranslate.HIDE"
        const val ACTION_STOP = "app.lenstranslate.STOP"
        private const val CHANNEL = "lt_service"
        private const val NOTIF_ID = 1

        @Volatile
        var instance: BubbleService? = null

        fun start(ctx: Context, action: String? = null) {
            val i = Intent(ctx, BubbleService::class.java).setAction(action)
            ContextCompat.startForegroundService(ctx, i)
        }
    }

    private lateinit var settings: AppSettings
    private lateinit var wm: WindowManager
    private lateinit var view: BubbleView
    private lateinit var params: WindowManager.LayoutParams
    private val handler = Handler(Looper.getMainLooper())

    private var added = false
    private var rightSide = true
    private var yFrac = 0.4f
    private var currentPkg: String? = null
    private var busy = false
    private var dragging = false
    private var touching = false
    private var lastActivity = 0L

    var hidden = false
        private set

    private val idleRunnable = Runnable {
        if (!hidden && !busy && !dragging && !touching) view.setState(BubbleState.IDLE)
    }
    private val watchdog = Runnable { finishTranslation() }

    override fun onBind(intent: Intent?): IBinder? = null

    override fun onCreate() {
        super.onCreate()
        instance = this
        settings = AppSettings(this)
        wm = getSystemService(WINDOW_SERVICE) as WindowManager
        createChannel()

        val themed = ContextThemeWrapper(this, android.R.style.Theme_DeviceDefault_Light)
        view = BubbleView(themed, settings).also { it.listener = this }
        val sz = sizePx()
        params = WindowManager.LayoutParams(
            sz, sz,
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH or
                WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
            PixelFormat.TRANSLUCENT
        ).apply { gravity = Gravity.TOP or Gravity.START }

        loadPos(null)
        applyPos(false)
        hidden = settings.bubbleHidden
        try {
            wm.addView(view, params)
            added = true
        } catch (e: Exception) {
            Toast.makeText(this, "فعّل إذن العرض فوق التطبيقات أولاً", Toast.LENGTH_LONG).show()
            stopSelf()
            return
        }
        view.dockSign = if (rightSide) 1 else -1
        if (hidden) {
            view.setState(BubbleState.HIDDEN)
        } else {
            view.setState(BubbleState.NEAR)
            scheduleIdle()
        }
        settings.bubbleEnabled = true
    }

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        val type = when {
            Build.VERSION.SDK_INT >= 34 -> ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
            Build.VERSION.SDK_INT >= 29 -> ServiceInfo.FOREGROUND_SERVICE_TYPE_MANIFEST
            else -> 0
        }
        ServiceCompat.startForeground(this, NOTIF_ID, buildNotification(), type)
        if (!added) return START_NOT_STICKY
        when (intent?.action) {
            ACTION_SHOW -> showBubble()
            ACTION_HIDE -> hideBubble()
            ACTION_STOP -> {
                settings.bubbleEnabled = false
                stopSelf()
            }
        }
        return START_STICKY
    }

    override fun onConfigurationChanged(newConfig: Configuration) {
        super.onConfigurationChanged(newConfig)
        if (added) applyPos(false)
    }

    override fun onDestroy() {
        handler.removeCallbacksAndMessages(null)
        if (added) {
            try { wm.removeView(view) } catch (_: Exception) {}
            added = false
        }
        instance = null
        super.onDestroy()
    }

    // ---------- الإخفاء والإ
