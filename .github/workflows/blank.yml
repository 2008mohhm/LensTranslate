package app.lenstranslate.core

import android.content.Context
import android.content.SharedPreferences

class AppSettings(context: Context) {
    private val p: SharedPreferences =
        context.applicationContext.getSharedPreferences("lenstranslate", Context.MODE_PRIVATE)

    private fun putInt(k: String, v: Int) = p.edit().putInt(k, v).apply()
    private fun putBool(k: String, v: Boolean) = p.edit().putBoolean(k, v).apply()

    // ---- الحالة ----
    var bubbleEnabled: Boolean
        get() = p.getBoolean("enabled", false)
        set(v) = putBool("enabled", v)
    var bubbleHidden: Boolean
        get() = p.getBoolean("hidden", false)
        set(v) = putBool("hidden", v)
    var autoStartOnBoot: Boolean
        get() = p.getBoolean("boot", true)
        set(v) = putBool("boot", v)

    // ---- Pro ----
    var isPro: Boolean
        get() = p.getBoolean("pro", false)
        set(v) = putBool("pro", v)

    // ---- الأيقونة (مجاني) ----
    var idleTimeoutSec: Int
        get() = p.getInt("idle_timeout", 4).coerceIn(2, 10)
        set(v) = putInt("idle_timeout", v)
    var sizeDp: Int
        get() = p.getInt("size_dp", 52).coerceIn(36, 80)
        set(v) = putInt("size_dp", v)
    var lockPosition: Boolean
        get() = p.getBoolean("lock", false)
        set(v) = putBool("lock", v)
    var hideWhileTranslating: Boolean
        get() = p.getBoolean("hide_while", true)
        set(v) = putBool("hide_while", v)

    // ---- الشفافية: القيم المخصصة لـ Pro فقط ----
    private var rawIdleOpacity: Int
        get() = p.getInt("op_idle", 60)
        set(v) = putInt("op_idle", v)
    private var rawActiveOpacity: Int
        get() = p.getInt("op_active", 12)
        set(v) = putInt("op_active", v)
    var idleOpacity: Int
        get() = if (isPro) rawIdleOpacity.coerceIn(20, 100) else 60
        set(v) { rawIdleOpacity = v }
    var activeOpacity: Int
        get() = if (isPro) rawActiveOpacity.coerceIn(5, 40) else 12
        set(v) { rawActiveOpacity = v }

    // ---- الحفظ ----
    var volumeSave: Boolean
        get() = p.getBoolean("vol_save", true)
        set(v) = putBool("vol_save", v)
    var saveFormat: SaveFormat
        get() = runCatching { SaveFormat.valueOf(p.getString("save_fmt", "IMAGE")!!) }
            .getOrDefault(SaveFormat.IMAGE)
        set(v) { p.edit().putString("save_fmt", v.name).apply() }

    // ---- موضع الأيقونة (لكل تطبيق) ----
    fun getPos(pkg: String?): BubblePos {
        val s = pkg?.let { p.getString("pos_$it", null) }
            ?: p.getString("pos_global", null)
            ?: return BubblePos(true, 0.4f)
        val parts = s.split(",")
        return BubblePos(parts[0] == "R", parts.getOrNull(1)?.toFloatOrNull() ?: 0.4f)
    }

    fun savePos(pkg: String?, pos: BubblePos) {
        val key = if (pkg == null) "pos_global" else "pos_$pkg"
        p.edit().putString(key, (if (pos.right) "R" else "L") + "," + pos.yFrac).apply()
    }

    fun resetPositions() {
        val e = p.edit()
        p.all.keys.filter { it.startsWith("pos_") }.forEach { e.remove(it) }
        e.apply()
    }
}


