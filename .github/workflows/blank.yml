package app.lenstranslate.extract

import android.accessibilityservice.AccessibilityService
import android.graphics.Rect
import android.os.SystemClock
import android.view.KeyEvent
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import app.lenstranslate.core.AppSettings
import app.lenstranslate.core.Pipeline
import app.lenstranslate.core.TextBlock
import app.lenstranslate.core.TextExtractor
import app.lenstranslate.overlay.BubbleService

/**
 * ثلاث مهام خفيفة:
 * 1) معرفة التطبيق الأمامي لتذكّر موضع الأيقونة لكل تطبيق.
 * 2) قراءة نصوص الشاشة مباشرة (أسرع وأدق من OCR).
 * 3) ضغط خفض الصوت مرتين لحفظ آخر ترجمة.
 */
class AccessibilityExtractor : AccessibilityService(), TextExtractor {

    companion object {
        @Volatile
        var instance: AccessibilityExtractor? = null
    }

    private var lastVolDown = 0L

    override fun onServiceConnected() {
        super.onServiceConnected()
        instance = this
    }

    override fun onUnbind(intent: android.content.Intent?): Boolean {
        instance = null
        return super.onUnbind(intent)
    }

    override fun onInterrupt() {}

    override fun onAccessibilityEvent(event: AccessibilityEvent) {
        if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
        val pkg = rootInActiveWindow?.packageName?.toString() ?: return
        if (pkg == packageName || pkg == "com.android.systemui") return
        BubbleService.instance?.onForegroundChanged(pkg)
    }

    override fun onKeyEvent(event: KeyEvent): Boolean {
        if (event.keyCode != KeyEvent.KEYCODE_VOLUME_DOWN ||
            event.action != KeyEvent.ACTION_DOWN || event.repeatCount != 0
        ) return false
        val settings = AppSettings(this)
        if (!settings.volumeSave) return false
        val now = SystemClock.uptimeMillis()
        if (now - lastVolDown < 450) {
            lastVolDown = 0
            Pipeline.impl.saveLast(applicationContext, settings.saveFormat)
            return true
        }
        lastVolDown = now
        return false
    }

    override fun extract(): List<TextBlock> {
        val root = rootInActiveWindow ?: return emptyList()
        val out = ArrayList<TextBlock>()
        val stack = ArrayDeque<AccessibilityNodeInfo>()
        stack.add(root)
        while (stack.isNotEmpty()) {
            val n = stack.removeLast()
            if (n.isVisibleToUser && n.childCount == 0) {
                val t = n.text?.toString() ?: n.contentDescription?.toString()
                if (!t.isNullOrBlank()) {
                    val r = Rect()
                    n.getBoundsInScreen(r)
                    if (!r.isEmpty) out.add(TextBlock(r, t.trim()))
                }
            }
            for (i in 0 until n.childCount) n.getChild(i)?.let { stack.add(it) }
        }
        return out
    }
}


