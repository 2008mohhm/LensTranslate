package app.lenstranslate.core

import android.content.Context
import android.os.Handler
import android.os.Looper
import android.widget.Toast

interface TextExtractor {
    fun extract(): List<TextBlock>
}

/** خط المعالجة: التقاط ← استخراج ← ترجمة ← عرض. يُستبدل في الخطوة 3. */
interface TranslationPipeline {
    /** يُستدعى عند ضغط الأيقونة؛ استدعِ onDone عند انتهاء العرض. */
    fun run(context: Context, onDone: () -> Unit)

    /** يحفظ آخر ترجمة كصورة أو PDF. */
    fun saveLast(context: Context, format: SaveFormat)
}

object Pipeline {
    @Volatile
    var impl: TranslationPipeline = StubPipeline()
}

class StubPipeline : TranslationPipeline {
    private val main = Handler(Looper.getMainLooper())

    override fun run(context: Context, onDone: () -> Unit) {
        main.post {
            Toast.makeText(context, "الالتقاط والترجمة تُضافان في الخطوة 3", Toast.LENGTH_SHORT).show()
        }
        main.postDelayed({ onDone() }, 1200)
    }

    override fun saveLast(context: Context, format: SaveFormat) {
        main.post {
            Toast.makeText(context, "الحفظ (${format.name}) يُضاف لاحقاً", Toast.LENGTH_SHORT).show()
        }
    }
}


